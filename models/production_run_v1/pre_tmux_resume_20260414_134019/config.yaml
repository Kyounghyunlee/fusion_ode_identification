data:
  data_dir: data
  edge_bc_mode: use_last_observed
  rho_grid_mode: uniform
  shots: all
model:
  depth: 4
  latent_gain: 1.0
  layers: 128
  source_scale: 3.0e5
output:
  log_dir: logs
  model_id: production_run_v1
  model_name: tokamak ode model
  save_dir: models
system:
  device: gpu
training:
  atol: 0.001
  batch_size: 8
  ema_decay: 0.999
  grad_clip: 1.0e3
  huber_delta: 10.0
  imex:
    atol: 1.0e-06
    dt_base: 0.001
    max_steps: 50000
    rtol: 0.0001
    substeps: 5
    theta: 0.7
  lambda_regime: 0.001
  lambda_src: 0.0001
  lambda_w: 0.0
  lambda_z: 0.0001
  lambda_zreg: 1.0e-05
  lbfgs_batch_shots: 8
  lbfgs_epochs: 10
  lbfgs_finetune: false
  lbfgs_history: 1
  lbfgs_maxiter: 20
  lbfgs_resample_shots_each_epoch: false
  lbfgs_tol: 5.0e-05
  learning_rate: 0.0002
  log_every: 50
  model_error_delta: 20.0
  num_restarts: 1
  optimizer: adamw
  rtol: 0.001
  solver: imex
  src_delta: 10.0
  total_steps: 5000
  warmup_steps: 5
  weight_decay: 3.0e-05
