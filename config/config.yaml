data:
  data_dir: "data"
  shots: "all"
  rho_grid_mode: "uniform"
  edge_bc_mode: "use_last_observed"
  split: "data/split.json"   # grouped session split; test sessions locked

training:
  seed: 0
  optimizer: "adamw"
  learning_rate: 2.0e-4
  weight_decay: 3.0e-5

  warmup_steps: 5
  # Ceiling only; early stopping (below) halts on validation plateau.
  total_steps: 3000
  batch_size: 8
  grad_clip: 1.0e3
  log_every: 50
  # Stop after `patience` evaluations without >= min_delta relative
  # improvement of the validation loss.
  early_stop_patience: 16
  early_stop_min_delta: 5.0e-4

  # Losses are normalized to O(1) per task (see loss.py: S_TE=100 eV,
  # S_SRC=1e4 eV/s), so these weights are interpretable ratios.
  huber_delta: 1.0
  lambda_src: 0.1
  src_delta: 1.0
  lambda_z: 1.0e-3
  lambda_zreg: 1.0e-3
  lambda_regime: 0.5
  lambda_dalpha: 2.0
  lambda_pH: 0.0

  imex:
    theta: 0.7
    substeps: 5
    max_steps: 50000

  ema_decay: 0.999

output:
  model_id: "v2_free_s0"
  save_dir: "models"
  log_dir: "logs"
  model_name: "model"
  # Short schedules: the raw best checkpoint beats the lagging EMA.
  checkpoint_preference: "best,best_ema"

model:
  layers: 128
  depth: 4
  source_scale: 3.0e5
  beta_mode: "free"        # "free" | "nonpositive" (constrained monostable)
  delta_chi_off: false     # ablation: no regime coupling in chi
  source_off: false        # ablation: no residual source
