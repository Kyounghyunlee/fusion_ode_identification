data:
  data_dir: "data"
  shots: "all"
  rho_grid_mode: "uniform"
  edge_bc_mode: "use_last_observed"

system:
  device: "auto"

training:
  num_restarts: 1

  optimizer: "adamw"
  learning_rate: 2.0e-4
  weight_decay: 3.0e-5

  warmup_steps: 5
  total_steps: 6000
  # Batch 8 is the practical ceiling: XLA-GPU core-dumps compiling the
  # gradient for batch >= 10 on this stack, and at batch 8 CPU (14 cores)
  # and the RTX 5080 are tied (~1.4 s/step, float64). CPU is the robust
  # choice for long runs; GPU works equally well at batch 8.
  batch_size: 8
  grad_clip: 1.0e3

  log_every: 50

  huber_delta: 10.0
  lambda_src: 1.0e-4
  src_delta: 10.0
  lambda_z: 1.0e-4
  lambda_zreg: 1.0e-5
  # Regime supervision is a first-class objective for the cusp latent
  # (the barrier_v1 setup used 1e-3 and relied on the D-alpha pin instead).
  lambda_regime: 5.0e-2
  # The D-alpha term supervises a learned observation head, not the latent
  # directly, so it no longer needs to dominate the loss.
  lambda_dalpha: 1.0
  lambda_pH: 0.0

  solver: "imex"
  rtol: 1.0e-3
  atol: 1.0e-3

  imex:
    theta: 0.7
    dt_base: 0.001
    substeps: 5
    max_steps: 50000
    rtol: 1.0e-4
    atol: 1.0e-6

  ema_decay: 0.999

  lbfgs_finetune: false

output:
  model_id: "cusp_run_v1"
  save_dir: "models"
  log_dir: "logs"
  model_name: "cusp_ode_model"

model:
  layers: 128
  depth: 4
  latent_design: "cusp"
  latent_gain: 1.0
  source_scale: 3.0e5
