data:
  data_dir: "data"
  shots: "all"
  rho_grid_mode: "uniform"
  edge_bc_mode: "use_last_observed"

system:
  device: "gpu"

training:
  num_restarts: 1

  optimizer: "adamw"
  learning_rate: 2.0e-4
  weight_decay: 3.0e-5

  warmup_steps: 5
  total_steps: 6000
  batch_size: 8
  grad_clip: 1.0e3

  log_every: 50

  huber_delta: 10.0
  lambda_src: 1.0e-4
  src_delta: 10.0
  lambda_z: 1.0e-4
  lambda_zreg: 1.0e-5
  lambda_regime: 1.0e-3
  lambda_dalpha: 10.0
  lambda_pH: 1.0e-3

  solver: "imex"
  rtol: 1.0e-3
  atol: 1.0e-3

  imex:
    theta: 0.7
    dt_base: 0.001
    substeps: 5
    max_steps: 50000
    rtol: 1.0e-4
    atol: 1.0e-6

  ema_decay: 0.999

  lbfgs_finetune: false
  lbfgs_maxiter: 20
  lbfgs_epochs: 10
  lbfgs_resample_shots_each_epoch: false
  lbfgs_history: 1
  lbfgs_batch_shots: 8
  lbfgs_tol: 5.0e-5

output:
  model_id: "production_run_v3"
  save_dir: "models"
  log_dir: "logs"
  model_name: "tokamak ode model"

model:
  layers: 128
  depth: 4
  latent_design: "barrier_v1"
  latent_gain: 1.0
  source_scale: 3.0e5